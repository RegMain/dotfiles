general {
    lock_cmd = pidof hyprlock || hyprlock       # Избегаем запуска нескольких копий hyprlock
    before_sleep_cmd = loginctl lock-session    # Обязательно лочим экран ПЕРЕД уходом в сон
    after_sleep_cmd = hyprctl dispatch dpms on  # Включаем экран при пробуждении, чтобы не нажимать кнопки дважды
}

# 1. Блокировка экрана (через 5 минут)
listener {
    timeout = 300                                 # 300 секунд = 5 минут
    on-timeout = loginctl lock-session            # Команда блокировки
}

# 2. Отключение подсветки экрана (через 5.5 минут)
listener {
    timeout = 330                                 # 330 секунд
    on-timeout = hyprctl dispatch dpms off        # Гасим экран
    on-resume = hyprctl dispatch dpms on          # Включаем обратно при шевелении мышкой
}

# 3. Спящий режим (через 15 минут)
listener {
    timeout = 600                                 # 900 секунд = 15 минут
    on-timeout = systemctl suspend                # Отправляем ноут в сон
}
