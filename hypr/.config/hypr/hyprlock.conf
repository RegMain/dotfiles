$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = false
}

auth {
    fingerprint {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/alcp/wallpaper.jpg
    blur_passes = 0
    brightness = 1.0
}

input-field {
    monitor =
    size = 520, 70
    outline_thickness = 1
    outer_color = rgb(ffffff)
    inner_color = rgb(161616)
    font_color = rgb(f0f0f2)
    check_color = rgb(6d73ca)
    fail_color = rgb(6d73ca)
    rounding = 0
    fade_on_empty = false
    font_family = $font
    placeholder_text = Password
    fail_text = Authentication failed
    check_text = Authenticating...
    dots_spacing = 0.3
    position = 0, 130
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgb(161616)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %d %B %Y"
    font_size = 18
    font_family = $font
    color = rgb(333333)
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = key: $LAYOUT[en,ru]
    font_size = 13
    font_family = $font
    color = rgb(161616)
    onclick = hyprctl switchxkblayout all next
    position = -20, -20
    halign = right
    valign = top
}
